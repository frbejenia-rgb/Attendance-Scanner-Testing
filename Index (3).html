<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--navy:#0d2a5c;--blue:#3a5f95;--green:#0f8a3e;--gold:#f5b50a;--flame:#ff6a2b;--text:#13203a;--muted:#64708a;--line:rgba(13,42,92,.10);--ok:#16a34a;--warn:#f59e0b;--bad:#e11d48}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
background:radial-gradient(900px 520px at 8% -8%,rgba(58,95,149,.30),transparent 60%),radial-gradient(700px 520px at 100% 2%,rgba(15,138,62,.20),transparent 60%),radial-gradient(640px 420px at 50% 112%,rgba(245,181,10,.22),transparent 60%),#f2f6fd;background-attachment:fixed}
header{background:linear-gradient(120deg,var(--navy) 0%,#17448f 55%,#1f6a5a 100%);color:#fff;padding:16px 16px 22px;border-radius:0 0 30px 30px;box-shadow:0 14px 34px rgba(13,42,92,.28);position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(245,181,10,.35),transparent 65%)}
.hwrap{max-width:980px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:68px;height:68px;border-radius:20px;background:#fff;padding:4px;box-shadow:0 6px 18px rgba(0,0,0,.25);flex:none}
.logo img{width:100%;height:100%;object-fit:contain;border-radius:16px}
.brand h1{margin:0;font-size:20px;line-height:1.15;font-weight:800;letter-spacing:-.2px}
.brand small{display:inline-block;margin-top:3px;opacity:.85;font-weight:600;letter-spacing:.6px;text-transform:uppercase;font-size:11px}
.clock{text-align:right}
.clock b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.1}
.clock .d{color:#cfe0ff;font-weight:600;font-size:13px}
.pill{display:inline-block;background:var(--gold);color:var(--navy);font-weight:800;border-radius:99px;padding:1px 11px;font-size:12px;margin-left:8px}
main{max-width:980px;margin:0 auto;padding:16px 14px 30px}
.tabs{display:flex;gap:6px;margin:-4px 0 16px;background:rgba(255,255,255,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);padding:5px;border-radius:99px;box-shadow:0 6px 20px rgba(13,42,92,.08)}
.tabs button{border:0;background:transparent;color:var(--muted);padding:9px 16px;border-radius:99px;cursor:pointer;font:inherit;font-weight:700}
.tabs button.on{background:var(--navy);color:#fff;box-shadow:0 4px 12px rgba(13,42,92,.3)}
.tabs .sp{margin-left:auto}
.card{background:rgba(255,255,255,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.95);border-radius:26px;padding:16px;margin-bottom:16px;box-shadow:0 12px 32px rgba(13,42,92,.10)}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:11px 18px;border-radius:14px;cursor:pointer;font:inherit;font-weight:700}
.btn.primary{background:linear-gradient(135deg,var(--navy),#1d58b8);color:#fff;border:0;box-shadow:0 8px 18px rgba(29,88,184,.35)}
.layout{display:grid;grid-template-columns:1.05fr .95fr;gap:16px}
@media (max-width:780px){.layout{grid-template-columns:1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.muted{color:var(--muted)}
#reader{width:100%;max-width:420px;margin:8px auto 0;border-radius:18px;overflow:hidden}
#lrn{width:100%;font:inherit;font-size:18px;font-weight:600;padding:13px 14px;border:2px solid var(--line);border-radius:14px;letter-spacing:2px;margin-top:6px;background:#fff}
#lrn:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(58,95,149,.15)}
/* Result */
.result{text-align:center;padding:26px 16px 22px;min-height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.result::before{content:"";position:absolute;inset:auto -20% -40% -20%;height:60%;background:radial-gradient(closest-side,var(--glow,rgba(58,95,149,.18)),transparent);pointer-events:none}
.pw{position:relative}
.photo{width:180px;height:180px;border-radius:34px;overflow:hidden;background:#e7ecf6;border:6px solid #fff;box-shadow:0 12px 30px rgba(13,42,92,.22),0 0 0 6px var(--ring,rgba(58,95,149,.25));display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:800;color:#fff;position:relative;z-index:1}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.idle{background:#fff}.photo.idle img{object-fit:contain;padding:8px}
.badge{position:absolute;right:-10px;bottom:-10px;width:46px;height:46px;border-radius:50%;background:var(--ring-solid,#9aa6bd);color:#fff;font-size:26px;font-weight:800;display:none;align-items:center;justify-content:center;border:4px solid #fff;z-index:2;box-shadow:0 6px 14px rgba(0,0,0,.2)}
.result.ok{--ring:rgba(22,163,74,.35);--ring-solid:var(--ok);--glow:rgba(22,163,74,.22)}
.result.warn{--ring:rgba(245,158,11,.38);--ring-solid:var(--warn);--glow:rgba(245,158,11,.22)}
.result.bad{--ring:rgba(225,29,72,.35);--ring-solid:var(--bad);--glow:rgba(225,29,72,.20)}
.result.ok .badge,.result.warn .badge,.result.bad .badge{display:flex}
.result.ok .badge::after{content:"\2713"}.result.warn .badge::after{content:"!"}.result.bad .badge::after{content:"\2715"}
.rname{font-size:30px;font-weight:800;margin:22px 0 2px;line-height:1.15;letter-spacing:-.5px;position:relative}
.rmeta{font-size:16px;color:var(--muted);font-weight:600;position:relative}
.greet{font-size:19px;font-weight:700;color:var(--navy);margin-top:12px;position:relative}
.banner{margin-top:16px;padding:11px 26px;border-radius:99px;font-weight:800;font-size:16px;letter-spacing:1px;color:#fff;background:linear-gradient(135deg,#7a879f,#9aa6bd);position:relative}
.result.ok .banner{background:linear-gradient(135deg,#15803d,#22c55e);box-shadow:0 10px 22px rgba(22,163,74,.35)}
.result.warn .banner{background:linear-gradient(135deg,#d97706,#fbbf24);box-shadow:0 10px 22px rgba(245,158,11,.35)}
.result.bad .banner{background:linear-gradient(135deg,#be123c,#fb7185);box-shadow:0 10px 22px rgba(225,29,72,.35)}
.result.pop .photo{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.result.pop .rname,.result.pop .greet,.result.pop .banner{animation:rise .4s ease-out}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes rise{0%{transform:translateY(10px);opacity:0}100%{transform:none;opacity:1}}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:rgba(255,255,255,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.95);border-radius:20px;padding:12px;text-align:center;box-shadow:0 8px 22px rgba(13,42,92,.08)}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.stat span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat.g b{color:var(--ok)}.stat.a b{color:#d97706}.stat.r b{color:var(--bad)}
.recent{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.recent:last-child{border-bottom:0}
.av{width:42px;height:42px;border-radius:14px;overflow:hidden;flex:none;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.av img{width:100%;height:100%;object-fit:cover}
.recent .n{font-weight:700;line-height:1.2}.recent .n small{display:block;color:var(--muted);font-weight:600}
.recent .t{margin-left:auto;text-align:right;font-size:12px;font-weight:700;color:var(--muted)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
input[type=date]{font:inherit;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}
.hide{display:none}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="brand"><div class="logo"><img id="logo" alt="School logo"></div><div><h1>Limao National High School</h1><small>Gate Attendance</small></div></div>
  <div class="clock"><b id="clk">--:--:--</b><span class="d" id="dte"></span><span class="pill" id="ses">AM</span></div>
</div></header>
<main>
<div class="tabs"><button class="on" id="t1">Gate scanner</button><button id="t2">Reports</button><button id="vc" class="sp">Voice: On</button><button id="fs">Full screen</button></div>

<section id="scan">
  <div class="layout">
    <div class="card result" id="result">
      <div class="pw"><div class="photo idle" id="photo"></div><div class="badge" id="badge"></div></div>
      <div class="rname" id="rname">Ready to scan</div>
      <div class="rmeta" id="rmeta">Scan a student ID</div>
      <div class="greet" id="greet"></div>
      <div class="banner" id="banner">WAITING</div>
    </div>
    <div>
      <div class="stats">
        <div class="stat g"><b id="s_ok">0</b><span>Checked in</span></div>
        <div class="stat a"><b id="s_dup">0</b><span>Repeat</span></div>
        <div class="stat r"><b id="s_bad">0</b><span>Unknown</span></div>
      </div>
      <div class="card">
        <div class="row"><button class="btn primary" id="camBtn">Start camera</button><span class="muted" id="qinfo">Point at the barcode on the ID</span></div>
        <div id="reader"></div>
        <label class="muted" for="lrn" style="display:block;margin-top:10px;font-weight:600">USB scanner or type the LRN, then Enter</label>
        <input id="lrn" inputmode="numeric" maxlength="12" autocomplete="off" placeholder="LRN">
      </div>
      <div class="card"><strong>Recent scans</strong><div id="recent"></div></div>
    </div>
  </div>
</section>

<section id="report" class="hide">
  <div class="card">
    <div class="row">
      <label>Date <input type="date" id="rdate"></label>
      <button class="btn primary" id="load">Load</button>
      <button class="btn" id="dl">Download for Excel (CSV)</button>
    </div>
    <div class="muted" id="rsum"></div>
    <div class="scroll"><table><thead><tr><th>LRN</th><th>Name</th><th>Grade</th><th>AM</th><th>PM</th><th>Status</th></tr></thead><tbody id="rbody"></tbody></table></div>
  </div>
</section>
</main>

var $ = function (id) { return document.getElementById(id); };
var inp = $('lrn');
var queue = [], busy = false, reportRows = [], CODE = '', hideTimer = null, stats = { ok: 0, dup: 0, bad: 0 };
var isTouch = ('ontouchstart' in window);
try { queue = JSON.parse(localStorage.getItem('gateQueue') || '[]'); CODE = localStorage.getItem('gateCode') || ''; } catch (e) {}
$('logo').src = LOGO;

// ---- Clock ----
function tick() {
  var d = new Date();
  $('clk').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  $('dte').textContent = d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  $('ses').textContent = d.getHours() < PM_START ? 'AM' : 'PM';
}
setInterval(tick, 1000); tick();

// ---- Greeting, sound, voice ----
function greeting(name) {
  var h = new Date().getHours();
  var g = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  return g + ', ' + String(name).trim().split(/\s+/)[0] + '! Welcome to ' + SCHOOL + '.';
}
var voiceOn = true, actx = null;
function speak(t) {
  if (!voiceOn || !window.speechSynthesis) return;
  try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.rate = 0.95; speechSynthesis.speak(u); } catch (e) {}
}
function beep(freq, ms) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq; g.gain.value = 0.15;
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + ms / 1000);
  } catch (e) {}
}

// ---- Result panel ----
function hue(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
function initials(n) { var p = String(n).trim().split(/\s+/); return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); }
function fillPhoto(el, photo, name) {
  el.innerHTML = ''; el.classList.remove('idle');
  if (photo) { var im = document.createElement('img'); im.src = photo; el.appendChild(im); el.style.background = '#e7ecf6'; }
  else { el.textContent = name ? initials(name) : '?'; el.style.background = name ? 'linear-gradient(135deg,hsl(' + hue(name) + ',55%,52%),hsl(' + ((hue(name) + 40) % 360) + ',55%,42%))' : 'linear-gradient(135deg,#9aa6bd,#7a879f)'; }
}
function panel(cls, name, meta, banner, photo, greet) {
  var r = $('result');
  r.className = 'card result ' + cls;
  void r.offsetWidth; r.classList.add('pop');
  fillPhoto($('photo'), photo, name);
  $('rname').textContent = name || banner;
  $('rmeta').textContent = meta;
  $('banner').textContent = banner;
  $('greet').textContent = greet || '';
  clearTimeout(hideTimer);
  if (cls) hideTimer = setTimeout(idle, 8000);
}
function idle() {
  $('result').className = 'card result';
  var ph = $('photo'); ph.innerHTML = ''; ph.style.background = ''; ph.className = 'photo idle';
  var im = document.createElement('img'); im.src = LOGO; ph.appendChild(im);
  $('rname').textContent = 'Ready to scan'; $('rmeta').textContent = 'Scan a student ID'; $('banner').textContent = 'WAITING'; $('greet').textContent = '';
}
function addRecent(r) {
  var d = document.createElement('div'); d.className = 'recent';
  var av = document.createElement('div'); av.className = 'av'; fillPhoto(av, r.photo, r.name);
  var n = document.createElement('div'); n.className = 'n'; n.textContent = r.name;
  var sm = document.createElement('small'); sm.textContent = 'Grade ' + r.grade; n.appendChild(sm);
  var t = document.createElement('div'); t.className = 't'; t.textContent = r.session + ' ' + r.time;
  d.appendChild(av); d.appendChild(n); d.appendChild(t);
  var box = $('recent'); box.insertBefore(d, box.firstChild);
  while (box.children.length > 6) box.removeChild(box.lastChild);
}
function bump(k) { stats[k]++; $('s_' + k).textContent = stats[k]; }
function show(r) {
  if (r.status === 'ok') {
    var gt = greeting(r.name);
    panel('ok', r.name, 'Grade ' + r.grade + '  |  ' + r.session + ' at ' + r.time, 'CHECKED IN', r.photo, gt);
    beep(880, 150); addRecent(r); bump('ok'); speak(gt);
  } else if (r.status === 'duplicate') {
    panel('warn', r.name, 'Grade ' + r.grade + '  |  first scan ' + r.session + ' at ' + r.time, 'ALREADY CHECKED IN', r.photo);
    beep(440, 250); bump('dup');
  } else {
    panel('bad', '', r.message || 'Error', r.banner || 'NOT RECOGNIZED', '');
    beep(220, 400); if (!r.banner) bump('bad');
  }
}
function note(cls, msg) { panel(cls, '', msg, cls === 'warn' ? 'OFFLINE' : 'CHECKING', ''); }

// ---- Server (two modes) ----
function saveQ() {
  try { localStorage.setItem('gateQueue', JSON.stringify(queue)); } catch (e) {}
  $('qinfo').textContent = queue.length ? queue.length + ' scan(s) waiting to sync' : 'Point at the barcode on the ID';
}
function askCode() {
  if (!CODE) { CODE = prompt('Enter the access code') || ''; try { localStorage.setItem('gateCode', CODE); } catch (e) {} }
  return CODE;
}
function callApi(params, ok, fail) {
  if (!askCode()) { fail(); return; }
  var q = Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
  fetch(API_URL + '?' + q + '&code=' + encodeURIComponent(CODE))
    .then(function (r) { return r.json(); })
    .then(function (r) {
      if (r.status === 'denied') { CODE = ''; try { localStorage.removeItem('gateCode'); } catch (e) {} }
      ok(r);
    }).catch(fail);
}
function sendScan(item, ok, fail) {
  if (!API_URL) google.script.run.withSuccessHandler(ok).withFailureHandler(fail).recordScan(item.lrn, item.ts);
  else callApi({ action: 'scan', lrn: item.lrn, ts: item.ts }, ok, fail);
}
function fetchReport(date, ok, fail) {
  if (!API_URL) google.script.run.withSuccessHandler(ok).withFailureHandler(fail).getReport(date);
  else callApi({ action: 'report', date: date }, function (r) { if (r.status === 'ok') ok(r.rows); else fail(); }, fail);
}
function pump() {
  if (busy || !queue.length) return;
  busy = true;
  sendScan(queue[0], function (r) {
    busy = false;
    if (r.status === 'denied') { note('warn', 'Wrong access code. Scan is saved and will retry.'); setTimeout(pump, 4000); return; }
    queue.shift(); saveQ(); show(r); pump();
  }, function () {
    busy = false;
    note('warn', 'No connection. ' + queue.length + ' scan(s) saved and will retry.');
    setTimeout(pump, 8000);
  });
}
function handleLrn(raw) {
  var v = String(raw).replace(/\D/g, '');
  if (v.length !== 12) { show({ status: 'invalid', banner: 'INVALID ID', message: 'LRN needs 12 digits: ' + v }); return; }
  queue.push({ lrn: v, ts: Date.now() }); saveQ(); pump();
}
inp.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  var v = inp.value; inp.value = ''; if (v) handleLrn(v);
});
document.addEventListener('click', function (e) {
  if (!isTouch && !e.target.closest('button,input[type=date]')) inp.focus();
});

// ---- Camera ----
var cam = null, camOn = false, lastCode = '', lastAt = 0;
function onCode(text) {
  var now = Date.now();
  if (text === lastCode && now - lastAt < 4000) { lastAt = now; return; }
  lastCode = text; lastAt = now;
  if (navigator.vibrate) navigator.vibrate(80);
  handleLrn(text);
}
function startCam() {
  if (typeof Html5Qrcode === 'undefined') { show({ status: 'invalid', banner: 'CAMERA ERROR', message: 'Camera library did not load. Check the internet.' }); return; }
  var F = Html5QrcodeSupportedFormats;
  cam = new Html5Qrcode('reader', { formatsToSupport: [F.CODE_128], experimentalFeatures: { useBarCodeDetectorIfSupported: true }, verbose: false });
  cam.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 300, height: 130 } }, onCode, function () {})
    .then(function () { camOn = true; $('camBtn').textContent = 'Stop camera'; })
    .catch(function (err) { cam = null; show({ status: 'invalid', banner: 'CAMERA ERROR', message: 'Camera blocked or unavailable: ' + err }); });
}
function stopCam() {
  if (!cam) return;
  cam.stop().then(function () { cam.clear(); cam = null; camOn = false; $('camBtn').textContent = 'Start camera'; });
}
$('camBtn').onclick = function () { camOn ? stopCam() : startCam(); };

// ---- Tabs, voice, full screen, reports ----
function tab(w) {
  $('scan').classList.toggle('hide', w !== 1); $('report').classList.toggle('hide', w !== 2);
  $('t1').classList.toggle('on', w === 1); $('t2').classList.toggle('on', w === 2);
  if (w === 2) { if (camOn) stopCam(); loadReport(); } else if (!isTouch) inp.focus();
}
$('t1').onclick = function () { tab(1); }; $('t2').onclick = function () { tab(2); };
$('vc').onclick = function () { voiceOn = !voiceOn; $('vc').textContent = 'Voice: ' + (voiceOn ? 'On' : 'Off'); if (voiceOn) speak('Voice on'); };
$('fs').onclick = function () { try { document.documentElement.requestFullscreen(); } catch (e) {} };

function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
$('rdate').value = today();
function loadReport() {
  var d = $('rdate').value; $('rsum').textContent = 'Loading…';
  fetchReport(d, function (rows) {
    reportRows = rows; var body = $('rbody'); body.innerHTML = ''; var present = 0;
    rows.forEach(function (r) {
      if (r[5] !== 'Absent') present++;
      var tr = document.createElement('tr');
      r.forEach(function (v) { var td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
      body.appendChild(tr);
    });
    $('rsum').textContent = present + ' of ' + rows.length + ' students present on ' + d;
  }, function () { $('rsum').textContent = 'Could not load the report.'; });
}
$('load').onclick = loadReport;
$('dl').onclick = function () {
  if (!reportRows.length) return;
  var lines = [['LRN', 'Name', 'Grade', 'AM', 'PM', 'Status']].concat(reportRows).map(function (r) {
    return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
  });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' }));
  a.download = 'attendance-' + $('rdate').value + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
};

idle(); saveQ(); pump();
</script>
</body>
</html>
